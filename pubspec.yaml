name: islamic_life
description: Islamic Life - حياتك الإسلامية
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0
  adhan: ^2.0.0
  hijri: ^3.0.0
  geolocator: ^13.0.0
  flutter_compass: ^0.8.0
  just_audio: ^0.9.40
  http: ^1.2.0
  path_provider: ^2.1.0
  intl: any
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
